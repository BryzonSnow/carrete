services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carrete
      POSTGRES_PASSWORD: carrete
      POSTGRES_DB: carrete
    ports:
      - "5433:5432"
    volumes:
      - carrete_pg:/var/lib/postgresql/data
      - ./supabase/schema.local.sql:/docker-entrypoint-initdb.d/001_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carrete -d carrete"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  carrete_pg:
